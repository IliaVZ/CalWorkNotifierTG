name: Update deadlines

on:
  schedule:
    # 14:00 UTC = 6am PST (UTC-8) / 7am PDT (UTC-7) -- morning in both seasons,
    # no DST split needed. GitHub may delay by 1-3h; delivery lands ~7-9am Pacific.
    - cron: "0 14 * * *"
  workflow_dispatch:  # "Run workflow" button on GitHub, for testing

permissions:
  contents: write  # so the job can commit the updated files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      # Re-parse the sites every other day: Mon, Wed, Fri, Sun (Pacific),
      # or whenever the workflow is started by hand.
      - name: Parse sites
        run: |
          weekday=$(TZ=America/Los_Angeles date +%u)  # 1 = Mon ... 7 = Sun
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$weekday" =~ ^[1357]$ ]]; then
            python fetch_data.py
          else
            echo "Not a parse day, keeping existing deadlines.json"
          fi

      # Messages are rebuilt every day so "due tonight" is always for today.
      - name: Build messages
        run: python make_messages.py

      - name: Commit changes
        run: |
          git config user.name "deadline-bot"
          git config user.email "deadline-bot@users.noreply.github.com"
          git add deadlines.json daily.txt weekly.txt
          git diff --cached --quiet || git commit -m "Update deadlines $(TZ=America/Los_Angeles date +%F)"
          git push

      - name: Send daily message to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if ! [[ "$TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN should look like 123456789:AAH... (nothing else in the value). It is ${#TOKEN} characters long."
            exit 1
          fi
          if ! [[ "$CHAT_ID" =~ ^-?[0-9]+$ ]]; then
            echo "::error::TELEGRAM_CHAT_ID should be just a number (nothing else in the value). It is ${#CHAT_ID} characters long."
            exit 1
          fi
          curl --fail-with-body -sS "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text@daily.txt" \
            --data-urlencode 'link_preview_options={"is_disabled": true}'
