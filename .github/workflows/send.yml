name: Send weekly Telegram message

on:
  schedule:
    # Observed GitHub queue delay is ~8h. Fire Mon 06:00 UTC (= Sun 10pm PST /
    # Sun 11pm PDT) so the job actually runs around Mon 14:00 UTC = Mon 6am PST.
    - cron: "0 6 * * 1"
  workflow_dispatch:  # "Run workflow" button on GitHub, for testing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Download weekly message from the repo
        run: |
          curl --fail -sS -o message.txt \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/weekly.txt"
          cat message.txt

      - name: Send to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if ! [[ "$TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN should look like 123456789:AAH... (nothing else in the value). It is ${#TOKEN} characters long."
            exit 1
          fi
          if ! [[ "$CHAT_ID" =~ ^-?[0-9]+$ ]]; then
            echo "::error::TELEGRAM_CHAT_ID should be just a number (nothing else in the value). It is ${#CHAT_ID} characters long."
            exit 1
          fi
          curl --fail-with-body -sS "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text@message.txt" \
            --data-urlencode 'link_preview_options={"is_disabled": true}'
